# Render.com deployment configuration
# This file enables automatic deployments from your GitHub repository

services:
  # Web service for the Yahoo Mail MCP Server
  - type: web
    name: yahoo-mail-mcp-server
    runtime: docker
    plan: free  # Change to 'starter' or higher for production use
    region: oregon  # Choose: oregon, frankfurt, singapore, ohio

    # Build configuration
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Environment variables (set sensitive values in Render Dashboard)
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRANSPORT_MODE
        value: sse
      - key: PORT
        fromService:
          type: web
          name: yahoo-mail-mcp-server
          property: port
      - key: YAHOO_EMAIL
        sync: false  # Set this in Render Dashboard (Settings > Environment)
      - key: YAHOO_APP_PASSWORD
        sync: false  # Set this in Render Dashboard (Settings > Environment)
      - key: OAUTH_CLIENT_ID
        sync: false  # REQUIRED - server refuses to start without it (openssl rand -hex 16)
      - key: OAUTH_CLIENT_SECRET
        sync: false  # REQUIRED - server refuses to start without it (openssl rand -hex 32)
      - key: OAUTH_APPROVAL_PASSWORD
        sync: false  # RECOMMENDED - owner password required on /oauth/authorize (openssl rand -base64 24)
      - key: TRUST_PROXY
        value: "1"  # Render's proxy is one hop in front; rate limits key on the client from X-Forwarded-For
      # Optional rate-limit tuning (defaults: 10/min OAuth, 120/min MCP per IP; 0 disables):
      # RATE_LIMIT_OAUTH_PER_MIN, RATE_LIMIT_MCP_PER_MIN, RATE_LIMIT_WINDOW_MS

    # Health check configuration
    healthCheckPath: /health

    # Auto-deploy settings
    autoDeploy: true

    # Scaling (for paid plans)
    numInstances: 1

    # Resource limits (for paid plans)
    # disk:
    #   name: data
    #   mountPath: /data
    #   sizeGB: 1
